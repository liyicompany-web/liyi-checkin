<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="padding: 20px;">
  <h3 id="status">正在識別身份...</h3>
  <div id="list"></div>

  <script>
    // 部署時請確認 ID 正確
    const LIFF_ID = "2010498585-GYrE99ub";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) { liff.login(); }
        else {
            liff.getProfile().then(p => {
                document.getElementById('status').innerHTML = "歡迎 " + p.displayName + "，正在查詢...";
                fetchData(p.displayName);
            });
        }
    });

    function fetchData(name) {
        fetch(GAS_URL + "?name=" + encodeURIComponent(name))
            .then(res => res.json())
            .then(data => {
                let html = "<ul>";
                if(data.length === 0) { html += "<li>查無紀錄 (請確認 LINE 名稱是否與 B 欄位一致)</li>"; }
                data.forEach(r => { html += `<li>${r.time} - ${r.action}</li>`; });
                document.getElementById('list').innerHTML = html + "</ul>";
            });
    }
  </script>
</body>
</html>
