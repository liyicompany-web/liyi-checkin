<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h3 id="status">正在轉跳至打卡紀錄查詢系統...</h3>
  <script>
    const GAS_URL = "你的網頁應用程式網址"; 

    liff.init({ liffId: "2010498585-GYrE99ub" }).then(() => {
        liff.getProfile().then(p => {
            // 直接跳轉，而不是使用 iframe
            window.location.href = GAS_URL + "?name=" + encodeURIComponent(p.displayName);
        });
    });
  </script>
</body>
</html>
