<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="padding: 20px; font-family: sans-serif;">
  <h3 id="status">正在識別身份...</h3>
  <iframe id="resultFrame" style="width: 100%; border: none; min-height: 400px;"></iframe>

  <script>
    const LIFF_ID = "2010498585-GYrE99ub";
    // 請將下方的網址替換為你這個 GAS 專案正確的「網頁應用程式網址」
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    liff.init({ liffId: LIFF_ID }).then(() => {
        liff.getProfile().then(p => {
            document.getElementById('status').innerHTML = "歡迎 " + p.displayName + "，查詢當月紀錄：";
            // 透過 iframe 將名字傳給 GAS
            document.getElementById('resultFrame').src = GAS_URL + "?name=" + encodeURIComponent(p.displayName);
        });
    });
  </script>
</body>
</html>
