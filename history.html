<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h3>個人打卡紀錄</h3>
  <div id="result">載入中...</div>

  <script>
    const LIFF_ID = "2010498585-GYrE99ub"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          const userName = profile.displayName; 
          
          // Debug: 跳出視窗，確認名字是否抓到
          alert("準備傳送的名字是: " + userName);
          
          if (!userName) {
            document.getElementById('result').innerHTML = "錯誤：抓不到 LINE 名稱 (請確認 LIFF 權限)";
          } else {
            fetchData(userName);
          }
        }
      } catch (err) {
        document.getElementById('result').innerHTML = "LIFF 初始化失敗: " + err;
      }
    }

    async function fetchData(name) {
      // 這裡直接在網頁顯示發送的 URL，方便檢查
      const url = `${GAS_URL}?name=${encodeURIComponent(name)}`;
      console.log("正在請求: " + url);
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.error) {
           document.getElementById('result').innerHTML = "後端錯誤: " + data.error;
           return;
        }
        
        let html = "<table border='1'><tr><th>時間</th><th>動作</th><th>工時</th></tr>";
        data.forEach(r => {
          html += `<tr><td>${r.time}</td><td>${r.action}</td><td>${r.hours}</td></tr>`;
        });
        document.getElementById('result').innerHTML = html + "</table>";
      } catch (err) {
        document.getElementById('result').innerHTML = "連線失敗: " + err;
      }
    }
    
    initLiff();
  </script>
</body>
</html>
