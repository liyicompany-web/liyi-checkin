<script>
  async function initLiff() {
    await liff.init({ liffId: "2010498585-GYrE99ub" });

      const userId = profile.userId; // 這裡抓到了 LINE ID

      liff.login();
    }
  }

    const data = await res.json();

  }
  
  initLiff();
</script>
