<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡查詢</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h3>個人打卡紀錄</h3>
  <div id="result">載入中...</div>

  <script>
    const LIFF_ID = "2010498585-GYrE99ub"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    async function initLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        const profile = await liff.getProfile();
        fetchData(profile.displayName);
      }
    }

    async function fetchData(name) {
      try {
        const response = await fetch(`${GAS_URL}?name=${encodeURIComponent(name)}`);
        const data = await response.json();
        
        if (data.length === 0) {
          document.getElementById('result').innerHTML = "查無紀錄: " + name;
          return;
        }
        
        let html = "<table><tr><th>時間</th><th>動作</th><th>工時</th></tr>";
        data.forEach(r => {
          html += `<tr><td>${r.time}</td><td>${r.action}</td><td>${r.hours}</td></tr>`;
        });
        document.getElementById('result').innerHTML = html + "</table>";
      } catch (err) {
        document.getElementById('result').innerHTML = "連線失敗";
      }
    }
    
    initLiff();
  </script>
</body>
</html>
