<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="padding: 20px;">
  <h3 id="status">正在自動識別身分...</h3>
  <div id="list"></div>

  <script>
    const LIFF_ID = "2010498585-GYrE99ub";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    liff.init({ liffId: LIFF_ID }).then(() => {
        liff.getProfile().then(p => {
            document.getElementById('status').innerHTML = "歡迎 " + p.displayName + "，撈取當月紀錄中...";
            fetch(GAS_URL + "?name=" + encodeURIComponent(p.displayName))
                .then(res => res.json())
                .then(data => {
                    let html = "<ul>";
                    if(data.length === 0) { html += "<li>本月無打卡紀錄</li>"; }
                    data.forEach(r => { html += `<li>${r.time} - ${r.action}</li>`; });
                    document.getElementById('list').innerHTML = html + "</ul>";
                });
        });
    });
  </script>
</body>
</html>
