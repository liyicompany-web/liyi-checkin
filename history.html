<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>查詢我的打卡紀錄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h3>個人打卡紀錄查詢</h3>
  <div id="status">正在準備環境...</div>
  <input type="text" id="userName" placeholder="請輸入姓名" style="padding: 10px; width: 60%;">
  <button onclick="queryData()" style="padding: 10px;">查詢</button>
  <div id="list" style="margin-top: 20px;"></div>

  <script>
    // 這裡替換成你原本打卡的 LIFF ID
    const LIFF_ID = "2010498585-GYrE99ub";
    // 這裡填入你 GAS 部署出來的網址 (結尾要有 /exec)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec";

    liff.init({ liffId: LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
            liff.getProfile().then(p => {
                document.getElementById('userName').value = p.displayName;
                queryData();
            });
        } else {
            document.getElementById('status').innerHTML = "請登入";
        }
    });

    function queryData() {
        const name = document.getElementById('userName').value;
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = "查詢中...";

        fetch(GAS_URL + "?name=" + encodeURIComponent(name))
            .then(res => res.json())
            .then(data => {
                let html = "<ul>";
                if(data.length === 0) { html += "<li>查無紀錄</li>"; }
                data.forEach(r => { html += `<li>${r.time} - ${r.action}</li>`; });
                listDiv.innerHTML = html + "</ul>";
            })
            .catch(err => { listDiv.innerHTML = "錯誤: " + err; });
    }
  </script>
</body>
</html>
