<!-- 在你的 index.html 中，原先放置 iframe 的位置 -->
<div id="check-area">
  <h3 id="status">正在載入紀錄...</h3>
  <!-- 給 iframe 一個名稱，避免快取衝突 -->
  <iframe id="resultFrame" name="resultFrame" style="width: 100%; border: none; min-height: 400px;"></iframe>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzMy6TBbqqi-hVcVSKq7vB2u4493XxmN7UJsHVLLBarnzI0YnnMBB4IAEEjjxGQqtyb/exec"; // 請確認這是你的最新部署網址

  liff.init({ liffId: "2010498585-GYrE99ub" }).then(() => {
    liff.getProfile().then(p => {
      document.getElementById('status').innerText = "歡迎 " + p.displayName;
      // 關鍵：明確指定 src，並強制加上隨機參數避免瀏覽器讀到舊的錯誤快取
      var finalUrl = GAS_URL + "?name=" + encodeURIComponent(p.displayName) + "&t=" + new Date().getTime();
      document.getElementById('resultFrame').src = finalUrl;
    });
  });
</script>
