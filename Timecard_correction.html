<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>各項申請單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { padding: 20px; font-family: sans-serif; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;}
    button { width: 100%; font-size: 18px; padding: 15px; background-color: #FF9800; color: white; border: none; border-radius: 8px; margin-top: 10px;}
  </style>
</head>
<body>
  <h2 id="welcome-msg" style="text-align: center;">載入中...</h2>
  
  <div id="form-container" style="display:none;">
    <!-- 新增：選擇申請類型 -->
    <div class="form-group">
      <label>申請類型</label>
      <select id="requestType" onchange="toggleForm()">
        <option value="correction">打卡修正申請</option>
        <option value="leave">特休申請</option>
      </select>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <!-- 區塊一：打卡修正申請的欄位 -->
    <div id="correction-fields">
      <div class="form-group">
        <label>補登動作</label>
        <select id="actionType">
          <option value="上班">上班</option>
          <option value="下班">下班</option>
        </select>
      </div>
      <div class="form-group">
        <label>實際打卡日期</label>
        <input type="date" id="reqDate">
      </div>
      <div class="form-group">
        <label>實際打卡時間</label>
        <input type="time" id="reqTime">
      </div>
      <div class="form-group">
        <label>異常原因</label>
        <input type="text" id="reason" placeholder="例如：GPS定位一直失敗">
      </div>
    </div>

    <!-- 區塊二：特休申請的欄位 (預設隱藏) -->
    <div id="leave-fields" style="display: none;">
      <div class="form-group">
        <label>申請日期</label>
        <input type="date" id="leaveDate">
      </div>
      <div class="form-group">
        <label>申請時數 (小時)</label>
        <input type="number" id="leaveHours" placeholder="例如：8" min="1" step="0.5">
      </div>
      <div class="form-group">
        <label>備註/事由 (選填)</label>
        <input type="text" id="leaveReason" placeholder="例如：家庭旅遊">
      </div>
    </div>

    <button onclick="submitForm()">送出申請</button>
  </div>
  <p id="status-text" style="color: #666; margin-top: 20px; text-align: center;"></p>

  <script>
    const MY_LIFF_ID = "2010498585-79hWXBD9"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbygHNPtauU-l3f1JTFi9vucwliq--Y91kVkJwSawz41ERn9g1YN_LzRlRAriCjvWzWgOA/exec"; 
    
    let userName = "";

    try {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        liff.getProfile().then(p => {
          userName = p.displayName;
          document.getElementById('welcome-msg').innerText = userName + " 的申請單";
          document.getElementById('form-container').style.display = "block";
        }).catch(err => {
          document.getElementById('welcome-msg').innerText = "讀取資料失敗：" + err.message;
        });
      }).catch(err => {
        document.getElementById('welcome-msg').innerText = "LIFF連線失敗：" + err.message;
      });
    } catch (error) {
      document.getElementById('welcome-msg').innerText = "程式錯誤：" + error.message;
    }

    // 負責切換顯示的表單欄位
    function toggleForm() {
      let type = document.getElementById('requestType').value;
      if (type === "correction") {
        document.getElementById('correction-fields').style.display = "block";
        document.getElementById('leave-fields').style.display = "none";
      } else if (type === "leave") {
        document.getElementById('correction-fields').style.display = "none";
        document.getElementById('leave-fields').style.display = "block";
      }
    }

    // 統整送出邏輯
    function submitForm() {
      let type = document.getElementById('requestType').value;
      let finalUrl = "";

      if (type === "correction") {
        let action = document.getElementById('actionType').value;
        let date = document.getElementById('reqDate').value;
        let time = document.getElementById('reqTime').value;
        let reason = document.getElementById('reason').value;

        if (!date || !time || !reason) {
          alert("請完整填寫補登日期、時間與異常原因！");
          return;
        }
        finalUrl = `${GAS_API_URL}?type=correction&name=${encodeURIComponent(userName)}&action=${encodeURIComponent(action)}&reqDate=${date}&reqTime=${time}&reason=${encodeURIComponent(reason)}`;
      
      } else if (type === "leave") {
        let leaveDate = document.getElementById('leaveDate').value;
        let leaveHours = document.getElementById('leaveHours').value;
        let leaveReason = document.getElementById('leaveReason').value;

        if (!leaveDate || !leaveHours) {
          alert("請填寫特休申請日期與時數！");
          return;
        }
        finalUrl = `${GAS_API_URL}?type=leave&name=${encodeURIComponent(userName)}&leaveDate=${leaveDate}&leaveHours=${leaveHours}&leaveReason=${encodeURIComponent(leaveReason)}`;
      }

      document.getElementById('status-text').innerText = "資料傳送中...";
      
      fetch(finalUrl).then(r => r.json()).then(data => {
        document.getElementById('status-text').innerText = data.message;
        if(data.status === "success") {
          alert("申請成功！請等候主管審核。");
          liff.closeWindow();
        }
      }).catch(err => {
        document.getElementById('status-text').innerText = "傳送失敗，請重試。";
      });
    }
  </script>
</body>
</html>
